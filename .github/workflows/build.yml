name: Gerar APK PAX PREVENIR
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js (Versao Nova)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inicializar Estrutura Nativa com CLI Atualizada
        run: npx @react-native-community/cli init PaxPrevenir --version 0.72.6 --skip-install

      - name: Organizar Pastas na Raiz
        run: |
          mv PaxPrevenir/android ./android
          mv PaxPrevenir/ios ./ios
          rm -rf PaxPrevenir

      - name: Instalar dependencias na Raiz
        run: npm install

      - name: Configurar Pontes Nativas do Expo no Android
        run: |
          # Adiciona o suporte aos pacotes do Expo na raiz do build do Android
          echo "apply from: new File([\"node\", \"--print\", \"require.resolve('expo-modules-core/package.json')\"].execute(null, null).text.trim(), \"../android/expo.gradle\")" >> android/build.gradle
          # Ativa o autolinking no arquivo de configuracoes do projeto
          sed -i '2i apply from: new File(["node", "--print", "require.resolve(\"expo-modules-core/package.json\")"].execute(null, null).text.trim(), "../android/settings_expo.gradle")' android/settings.gradle

      - name: Criar Pasta de Assets do Android
        run: mkdir -p android/app/src/main/assets

      - name: Gerar Bundle do JavaScript Independente
        run: npx react-native bundle --platform android --dev false --entry-file App.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Compilar o APK de Producao Independente
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: App-PaxPrevenir-Instalavel
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
