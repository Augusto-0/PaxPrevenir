name: Gerar APK PAX PREVENIR
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Instalar dependencias do App
        run: npm install

      - name: Inicializar Estrutura Nativa do Android
        run: npx react-native init PaxPrevenir --version 0.72.6 --skip-install

      - name: Injetar Codigo Customizado
        run: |
          cp App.js PaxPrevenir/App.js
          cd PaxPrevenir

      - name: Compilar o APK Final
        run: |
          cd PaxPrevenir/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: App-PaxPrevenir-Instalavel
          path: PaxPrevenir/android/app/build/outputs/apk/debug/app-debug.apk
