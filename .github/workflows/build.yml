name: Gerar APK PAX PREVENIR
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js (Versao Nova)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias na Raiz
        run: npm install

      - name: Gerar Estrutura Android Oficial
        run: npx expo prebuild --platform android --no-install

      - name: Forcar Unificacao da Versao do Java (JVM Target)
        run: |
          # Alinha as diretrizes do compilador para Java 17 em todas as subtarefas nativas
          echo "tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = '17' } }" >> android/build.gradle
          echo "subprojects { tasks.withType(JavaCompile) { options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'; sourceCompatibility = '17'; targetCompatibility = '17' } }" >> android/build.gradle

      - name: Compilar o APK de Producao Independente
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: App-PaxPrevenir-Instalavel
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
