name: Gerar APK PAX PREVENIR
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js (Versao Nova)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Instalar dependencias na Raiz
        run: npm install

      - name: Exportar bundles do Expo
        run: npx expo export --platform android

      - name: Gerar Estrutura Android Oficial Otimizada
        run: npx expo prebuild --platform android --no-install

      - name: Compilar o APK de Producao Independente
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"
          
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: App-PaxPrevenir-Instalavel
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
